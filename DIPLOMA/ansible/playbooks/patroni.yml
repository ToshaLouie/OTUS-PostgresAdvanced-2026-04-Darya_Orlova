- name: Install PostgreSQL and Patroni
  hosts: postgres
  become: true
  gather_facts: true
  serial: 1
  roles:
    - patroni

- name: Ensure required PostgreSQL roles
  hosts: postgres
  become: true
  gather_facts: false
  tasks:
    - name: Detect current primary
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8008/primary"
        method: GET
        status_code: [200, 503]
      register: primary_check

    - name: Ensure passwords and monitoring roles on primary
      become_user: postgres
      ansible.builtin.shell: |
        psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
        ALTER ROLE postgres PASSWORD '{{ postgres_superuser_password }}';
        ALTER ROLE {{ postgres_replication_user }} PASSWORD '{{ postgres_replication_password }}';

        DO $$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='{{ patroni_admin_user }}') THEN
            CREATE ROLE {{ patroni_admin_user }} LOGIN PASSWORD '{{ patroni_admin_password }}' CREATEROLE CREATEDB;
          ELSE
            ALTER ROLE {{ patroni_admin_user }} WITH LOGIN PASSWORD '{{ patroni_admin_password }}' CREATEROLE CREATEDB;
          END IF;

          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_exporter_user }}') THEN
            CREATE ROLE {{ postgres_exporter_user }} LOGIN PASSWORD '{{ postgres_exporter_password }}';
          ELSE
            ALTER ROLE {{ postgres_exporter_user }} WITH LOGIN PASSWORD '{{ postgres_exporter_password }}';
          END IF;

          GRANT pg_monitor TO {{ postgres_exporter_user }};
        END
        $$;
        SQL
      when: primary_check.status == 200
      changed_when: true

- name: Verify Patroni cluster
  hosts: pg-01
  become: true
  gather_facts: false
  tasks:
    - name: Show Patroni cluster
      ansible.builtin.command:
        argv:
          - /opt/patroni/bin/patronictl
          - -c
          - /etc/patroni/patroni.yml
          - list
      register: cluster
      changed_when: false
    - ansible.builtin.debug:
        var: cluster.stdout_lines
